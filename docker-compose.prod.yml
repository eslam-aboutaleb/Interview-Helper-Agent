# Production stack.
#
# The database service is profile-gated ("container-db") so the same
# file works in two modes:
#   Container DB:  docker compose -f docker-compose.prod.yml --profile container-db up -d
#   RDS mode:      docker compose -f docker-compose.prod.yml up -d
#                  (set DATABASE_URL to the RDS endpoint in .env)
#
# All credentials come from the environment / .env file — nothing
# is hardcoded.

services:
  db:
    image: postgres:15
    container_name: interview-prep-db
    restart: unless-stopped
    profiles: ['container-db']
    environment:
      POSTGRES_DB: ${DB_NAME:-interview_prep}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: ./backend
    container_name: interview-prep-backend
    restart: unless-stopped
    environment:
      # Compose the URL from the required DB_* variables so the backend
      # never silently starts against default credentials. In RDS mode set
      # DATABASE_URL explicitly and it takes precedence.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-interview_prep}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      # Explicit origins only: a "*" default is incompatible with the
      # credentials the backend enables (see main.py CORS validation).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview-prep-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
      - '${FRONTEND_SSL_PORT:-443}:443'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

volumes:
  postgres_data:
