# GitHub Actions CI pipeline.
#
# Jobs:
#   lint-backend      — ruff check + ruff format --check
#   lint-frontend     — prettier --check + tsc/vite build
#   test              — pytest with coverage gate (>= 90%)
#   docker            — docker compose build (both images)
#   dependency-review — flag vulnerable dependency bumps (PRs only)
#
# Action references are pinned to major-version tags. For
# production hardening, pin each `uses:` to the full commit
# SHA (e.g. actions/checkout@<40-char-sha>) — see the
# "Pinning actions" note in CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.6.9
      - name: ruff check
        run: ruff check backend/
      - name: ruff format --check
        run: ruff format --check backend/

  lint-frontend:
    name: Lint frontend (prettier + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css,js}" index.html
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  test:
    name: Backend tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests with coverage
        working-directory: backend
        # Uses scripts/check_coverage.sh rather than pytest --cov flags.
        # pytest-cov loses import tracking when pytest is given a directory
        # argument here and reports 0% for every module, so an addopts/CLI
        # based gate would fail regardless of the real coverage number.
        # The script runs `coverage run` + `coverage report`, which measures
        # correctly and enforces fail_under from backend/.coveragerc.
        run: |
          python -m coverage run --source=. -m pytest tests/
          python -m coverage xml -o coverage.xml
          python -m coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose -f docker-compose.yml build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
