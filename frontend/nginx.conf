server {
  listen 80;

  # Allow resume / job-description uploads through the proxy. The nginx
  # default is 1 MB, which rejects most real resumes and PDFs with a 413.
  client_max_body_size 10m;

  # This is the entry point for the React application
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
  
  # Proxy all /api requests to the FastAPI backend.
  # NOTE: proxy_pass has NO trailing slash so the /api prefix is preserved.
  # The backend mounts its routers under /api (see backend/main.py), and the
  # Vite dev proxy (vite.config.ts) also forwards /api unchanged. Keeping the
  # prefix here makes dev and production behave identically.
  location /api/ {
    # The name 'backend' comes from the service name in docker-compose.prod.yml
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Interactive API documentation (Swagger UI) and OpenAPI schema,
  # served by the backend and proxied through the frontend so the
  # backend port never needs to be public.
  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
