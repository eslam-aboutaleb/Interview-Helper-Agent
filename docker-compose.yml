# Development stack with hot-reload.
# All credentials come from the environment / .env file.

services:
  db:
    image: postgres:15
    container_name: interview-prep-db
    environment:
      POSTGRES_DB: ${DB_NAME:-interview_prep}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is managed by Alembic migrations (backend/alembic/),
      # applied with `alembic upgrade head` — see README. The old
      # db/init.sql provisioning script is intentionally not mounted
      # so fresh volumes start empty for migrations.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: interview-prep-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/interview_prep}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      # Explicit origins only: a "*" default is incompatible with the
      # credentials the backend enables (see main.py CORS validation).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend
          action: rebuild

  frontend:
    build: ./frontend
    container_name: interview-prep-frontend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - path: ./frontend
          action: rebuild

volumes:
  postgres_data:
