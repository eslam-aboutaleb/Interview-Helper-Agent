# Ruff configuration for the backend.
# Python 3.9 is the minimum supported version.

# 120 keeps the check compatible with the long LLM prompt
# strings used by the question-generation and evaluation
# services.
line-length = 120
target-version = "py39"

# Autogenerated Alembic migrations are excluded from
# lint/format: they are produced by `alembic revision
# --autogenerate` and should not be hand-edited.
# The glob matches at any depth so the rule holds
# whether ruff runs from the repo root or backend/.
extend-exclude = ["**/alembic/versions/"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]

[lint.per-file-ignores]
"**/tests/*" = ["E402"]   # allow imports after sys.path manipulation
